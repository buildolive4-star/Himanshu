name: Android CI & APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Test Metro Legends APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore for CI signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Inject optional Sketchfab secret into .env
        env:
          SKETCHFAB_API_TOKEN: ${{ secrets.SKETCHFAB_API_TOKEN }}
        run: |
          if [ -n "$SKETCHFAB_API_TOKEN" ]; then
            echo "SKETCHFAB_API_TOKEN=$SKETCHFAB_API_TOKEN" > .env
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Metro Legends Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroLegends-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
